<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clean SRT - Serkan SARP</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --surface: #181818;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --muted: #555;
    --accent: #c8f060;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .container {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }

  header { display: flex; flex-direction: column; gap: 0.3rem; }

  h1 {
    font-family: 'DM Mono', monospace;
    font-weight: 300;
    font-size: 1.4rem;
    letter-spacing: 0.08em;
    color: var(--accent);
  }

  .subtitle { font-size: 0.98rem; color: white; letter-spacing: 0.03em; }

  .drop-zone {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3rem 2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
    overflow: hidden;
  }

  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    background: rgba(200, 240, 96, 0.03);
  }

  .drop-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .drop-icon {
    font-family: 'DM Mono', monospace;
    font-size: 1.8rem;
    color: var(--muted);
    margin-bottom: 0.8rem;
    display: block;
    transition: color 0.2s;
  }

  .drop-zone:hover .drop-icon { color: var(--accent); }
  .drop-label { font-size: 0.90rem; color: yellow; letter-spacing: 0.04em; }

  .file-info {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1rem 1.2rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    color: var(--text);
    letter-spacing: 0.03em;
    gap: 0.6rem;
    flex-direction: column;
  }

  .file-info.visible { display: flex; }
  .file-name { color: var(--accent); word-break: break-all; }
  .file-meta { color: var(--muted); font-size: 0.72rem; }

  .stats { display: none; gap: 2rem; }
  .stats.visible { display: flex; }

  .stat { display: flex; flex-direction: column; gap: 0.2rem; }
  .stat-value { font-family: 'DM Mono', monospace; font-size: 0.82rem; color: var(--accent); }
  .stat-label { font-size: 0.7rem; color: white; letter-spacing: 0.04em; }

  .btn {
    background: var(--accent);
    color: #0f0f0f;
    border: none;
    border-radius: 4px;
    padding: 0.85rem 1.5rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.82rem;
    font-weight: 400;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    display: none;
    width: 100%;
  }

  .btn:hover { background: #d8ff70; }
  .btn:active { transform: scale(0.99); }
  .btn.visible { display: block; }

  .divider { height: 1px; background: var(--border); }

  .preview { display: none; flex-direction: column; gap: 0.8rem; }
  .preview.visible { display: flex; }

  .preview-label {
    font-size: 0.72rem;
    color: white;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
  }

  .preview-content {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1rem 1.2rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    color: white;
    line-height: 1.6;
    max-height: 160px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .preview-content::-webkit-scrollbar { width: 4px; }
  .preview-content::-webkit-scrollbar-track { background: transparent; }
  .preview-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Clean SRT - by Serkan Sarp @ 2026</h1>
    <p class="subtitle">SRT altyazı dosyalarından tüm etiketleri temizler.</p>
  </header>

  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".srt">
    <span class="drop-icon">⌄</span>
    <p class="drop-label">.srt dosyasını sürükleyin veya seçin</p>
  </div>

  <div class="file-info" id="fileInfo">
    <span class="file-name" id="fileName"></span>
    <span class="file-meta" id="fileMeta"></span>
  </div>

  <div class="stats" id="stats">
    <div class="stat">
      <span class="stat-value" id="statLines">—</span>
      <span class="stat-label">satır</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="statTags">—</span>
      <span class="stat-label">etiket temizlendi</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="statSize">—</span>
      <span class="stat-label">boyut</span>
    </div>
  </div>

  <button class="btn" id="cleanBtn">Temizle!</button>

  <div class="preview" id="preview">
    <div class="divider"></div>
    <span class="preview-label">Önizleme</span>
    <div class="preview-content" id="previewContent"></div>
  </div>
</div>

<script>
  let currentFile = null;

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const fileInfo = document.getElementById('fileInfo');
  const fileName = document.getElementById('fileName');
  const fileMeta = document.getElementById('fileMeta');
  const stats = document.getElementById('stats');
  const cleanBtn = document.getElementById('cleanBtn');
  const preview = document.getElementById('preview');
  const previewContent = document.getElementById('previewContent');

  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.name.endsWith('.srt')) loadFile(file);
  });

  fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) loadFile(file);
  });

  function loadFile(file) {
    currentFile = file;
    fileName.textContent = file.name;
    fileMeta.textContent = (file.size / 1024).toFixed(1) + ' kb';
    fileInfo.classList.add('visible');
    cleanBtn.classList.add('visible');
    stats.classList.remove('visible');
    preview.classList.remove('visible');
  }

  function cleanSRT(content) {
    const tagPatterns = [
      /<[^>]+>/g,
      /\{[^}]+\}/g,
      /\[[^\]]+\]/g,
    ];

    let tagCount = 0;
    let cleaned = content;

    tagPatterns.forEach(pattern => {
      const matches = cleaned.match(pattern);
      if (matches) tagCount += matches.length;
      cleaned = cleaned.replace(pattern, '');
    });

    cleaned = cleaned.split('\n').map(line => line.trim()).join('\n');
    cleaned = cleaned.replace(/\n{3,}/g, '\n\n');

    return { cleaned, tagCount };
  }

  function isValidUTF8(bytes) {
    let i = 0;
    while (i < bytes.length) {
      if (bytes[i] <= 0x7F) { i++; continue; }
      let extra = 0;
      if ((bytes[i] & 0xE0) === 0xC0) extra = 1;
      else if ((bytes[i] & 0xF0) === 0xE0) extra = 2;
      else if ((bytes[i] & 0xF8) === 0xF0) extra = 3;
      else return false;
      for (let j = 1; j <= extra; j++) {
        if (i + j >= bytes.length || (bytes[i + j] & 0xC0) !== 0x80) return false;
      }
      i += extra + 1;
    }
    return true;
  }

  cleanBtn.addEventListener('click', () => {
    if (!currentFile) return;

    // 1. Adım: binary olarak oku, encoding tespit et
    const rawReader = new FileReader();
    rawReader.onload = function(e) {
      const buffer = e.target.result;
      const bytes = new Uint8Array(buffer);
      const hasUTF8BOM = bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF;
      const encoding = (hasUTF8BOM || isValidUTF8(bytes)) ? 'UTF-8' : 'windows-1254';

      // 2. Adım: doğru encoding ile oku
      const textReader = new FileReader();
      textReader.onload = function(e) {
        const content = e.target.result;
        const { cleaned, tagCount } = cleanSRT(content);

        const lines = cleaned.split('\n').length;
        document.getElementById('statLines').textContent = lines.toLocaleString();
        document.getElementById('statTags').textContent = tagCount.toLocaleString();
        document.getElementById('statSize').textContent = (new Blob([cleaned]).size / 1024).toFixed(1) + ' kb';
        stats.classList.add('visible');

        const previewLines = cleaned.split('\n').slice(0, 20).join('\n');
        previewContent.textContent = previewLines + (lines > 20 ? '\n...' : '');
        preview.classList.add('visible');

        // Çıktıyı her zaman UTF-8 olarak kaydet
        const baseName = currentFile.name.replace(/\.srt$/i, '');
        const outputName = baseName + '--clnd.srt';
        const blob = new Blob([cleaned], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = outputName;
        a.click();
        URL.revokeObjectURL(url);
      };
      textReader.readAsText(currentFile, encoding);
    };
    rawReader.readAsArrayBuffer(currentFile);
  });
</script>
</body>
</html>
